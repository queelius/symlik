site_name: symlik
site_description: Symbolic Likelihood Models for Statistical Inference
site_url: https://queelius.github.io/symlik/
repo_url: https://github.com/queelius/symlik
repo_name: queelius/symlik

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - First Model: getting-started/first-model.md
    - S-Expressions: getting-started/s-expressions.md
  - Tutorials:
    - Fitting Distributions: tutorials/fitting-distributions.md
    - Custom Models: tutorials/custom-models.md
    - Contribution Models: tutorials/contribution-models.md
    - Series Systems: tutorials/series-systems.md
    - Symbolic Calculus: tutorials/symbolic-calculus.md
  - Reference:
    - Distributions: reference/distributions.md
    - LikelihoodModel: reference/model.md
    - ContributionModel: reference/contribution.md
    - Series Systems: reference/series.md
    - Calculus Functions: reference/calculus.md
